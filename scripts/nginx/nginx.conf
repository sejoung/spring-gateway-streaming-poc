# Front-proxy buffering/compression variants for T12.
# Ports: 81xx -> Gateway MVC (:8080), 82xx -> Gateway WebFlux (:8082); xx = 80 default, 81 buffered, 82 gzip.
# Run: docker run --rm -p 8180-8182:8180-8182 -p 8280-8282:8280-8282 -v $PWD/scripts/nginx/nginx.conf:/etc/nginx/nginx.conf:ro nginx:1.27-alpine

events {}

http {
    access_log off;

    # mvc / default
    # nginx defaults (proxy_buffering on) — honours the backend's X-Accel-Buffering: no
    server {
        listen 8180;
        location / {
            proxy_pass http://host.docker.internal:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
        }
    }

    # mvc / buffered
    # proxy_buffering on and X-Accel-Buffering ignored: what a front proxy does when nobody opts out
    server {
        listen 8181;
        location / {
            proxy_pass http://host.docker.internal:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
            proxy_ignore_headers X-Accel-Buffering;
        }
    }

    # mvc / gzip
    # buffering off, gzip on for text/event-stream
    server {
        listen 8182;
        location / {
            proxy_pass http://host.docker.internal:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
            proxy_buffering off;
            gzip on;
            gzip_types text/event-stream;
            gzip_min_length 0;
        }
    }

    # webflux / default
    # nginx defaults (proxy_buffering on) — honours the backend's X-Accel-Buffering: no
    server {
        listen 8280;
        location / {
            proxy_pass http://host.docker.internal:8082;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
        }
    }

    # webflux / buffered
    # proxy_buffering on and X-Accel-Buffering ignored: what a front proxy does when nobody opts out
    server {
        listen 8281;
        location / {
            proxy_pass http://host.docker.internal:8082;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
            proxy_ignore_headers X-Accel-Buffering;
        }
    }

    # webflux / gzip
    # buffering off, gzip on for text/event-stream
    server {
        listen 8282;
        location / {
            proxy_pass http://host.docker.internal:8082;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
            proxy_buffering off;
            gzip on;
            gzip_types text/event-stream;
            gzip_min_length 0;
        }
    }

}
