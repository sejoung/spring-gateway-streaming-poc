server {
    listen 80;
    root /usr/share/nginx/html;

    # Test runner API (including its progress SSE) on the same origin as the page.
    location /runner-api/ {
        proxy_pass http://test-runner:8070/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
