server:
  port: 8081

spring:
  application:
    name: ai-backend

chat:
  stream:
    max-count: 10000
    max-delay-ms: 60000
    max-duration: 10m
    log-each-event: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n"
