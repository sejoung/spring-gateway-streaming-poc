# Front proxy in front of each gateway for scenario 16 (docker compose).
# 8180-8182 -> gateway-mvc, 8280-8282 -> gateway-webflux, 8380-8382 -> gateway-mvc-tuned; +0 default, +1 buffered, +2 gzip.

events {}

http {
    access_log off;
    # Docker DNS; resolve per request (via variables) so a restarted gateway with a new IP keeps working.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # gateway-mvc / default: nginx defaults (proxy_buffering on); honours the backend's X-Accel-Buffering: no
    server {
        listen 8180;
        location / {
            set $upstream http://gateway-mvc:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
        }
    }

    # gateway-mvc / buffered: proxy_buffering on and X-Accel-Buffering ignored
    server {
        listen 8181;
        location / {
            set $upstream http://gateway-mvc:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
            proxy_ignore_headers X-Accel-Buffering;
        }
    }

    # gateway-mvc / gzip: buffering off, nginx itself compresses (the gateway is asked for an uncompressed body)
    server {
        listen 8182;
        location / {
            set $upstream http://gateway-mvc:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
            proxy_buffering off;
            proxy_set_header Accept-Encoding "";
            gzip on;
            gzip_types text/event-stream;
            gzip_min_length 0;
        }
    }

    # gateway-webflux / default: nginx defaults (proxy_buffering on); honours the backend's X-Accel-Buffering: no
    server {
        listen 8280;
        location / {
            set $upstream http://gateway-webflux:8082;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
        }
    }

    # gateway-webflux / buffered: proxy_buffering on and X-Accel-Buffering ignored
    server {
        listen 8281;
        location / {
            set $upstream http://gateway-webflux:8082;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
            proxy_ignore_headers X-Accel-Buffering;
        }
    }

    # gateway-webflux / gzip: buffering off, nginx itself compresses (the gateway is asked for an uncompressed body)
    server {
        listen 8282;
        location / {
            set $upstream http://gateway-webflux:8082;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
            proxy_buffering off;
            proxy_set_header Accept-Encoding "";
            gzip on;
            gzip_types text/event-stream;
            gzip_min_length 0;
        }
    }

    # gateway-mvc-tuned / default: nginx defaults (proxy_buffering on); honours the backend's X-Accel-Buffering: no
    server {
        listen 8380;
        location / {
            set $upstream http://gateway-mvc-tuned:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
        }
    }

    # gateway-mvc-tuned / buffered: proxy_buffering on and X-Accel-Buffering ignored
    server {
        listen 8381;
        location / {
            set $upstream http://gateway-mvc-tuned:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
            proxy_ignore_headers X-Accel-Buffering;
        }
    }

    # gateway-mvc-tuned / gzip: buffering off, nginx itself compresses (the gateway is asked for an uncompressed body)
    server {
        listen 8382;
        location / {
            set $upstream http://gateway-mvc-tuned:8080;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
            proxy_buffering off;
            proxy_set_header Accept-Encoding "";
            gzip on;
            gzip_types text/event-stream;
            gzip_min_length 0;
        }
    }

}
